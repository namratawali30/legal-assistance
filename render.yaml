# Render Blueprint Specification for Nyaya AI Staging Deployment
# Target Region: Singapore (singapore)

services:
  # 1. Backend Web Service API
  - type: web
    name: nyaya-ai-api-staging
    runtime: docker
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: staging
      - key: RELEASE_ID
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DATABASE
        value: nyaya_ai_staging
      - key: STORAGE_BACKEND
        value: s3
      - key: REQUIRE_OBJECT_STORAGE_IN_PRODUCTION
        value: "false"
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_REGION
        value: auto
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_SECRET_KEY
        sync: false
      - key: OBJECT_STORAGE_SSE
        value: "none"
      - key: RATE_LIMIT_BACKEND
        value: redis
      - key: REDIS_URL
        fromKeyValue:
          name: nyaya-ai-rate-limit-staging
          property: connectionString
      - key: MALWARE_SCANNER_TYPE
        value: clamav
      - key: CLAMAV_HOST
        value: nyaya-ai-clamav-staging
      - key: CLAMAV_PORT
        value: "3310"
      - key: JWT_SECRET
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false

  # 2. Frontend React SPA Static Site
  - type: site
    name: nyaya-ai-staging
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: nyaya-ai-api-staging
          property: host

  # 3. Private ClamAV Antivirus Scanner
  - type: pserv
    name: nyaya-ai-clamav-staging
    runtime: image
    region: singapore
    image:
      url: clamav/clamav:latest

keyvalues:
  # 4. Render Key Value (Valkey / Redis Rate Limiter)
  - name: nyaya-ai-rate-limit-staging
    region: singapore
